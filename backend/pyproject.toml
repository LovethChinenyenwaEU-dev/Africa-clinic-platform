[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "BLE"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Core never depends on feature modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules"]